
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f0fe;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #1a237e;
        }

        .login-button {
            background-color: #1a237e;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Efecto al pasar el cursor */
        .login-button:hover {
            background-color: #3949ab;
            transform: scale(1.08);
            box-shadow: 0 5px 15px rgba(26,35,126,0.3);
        }

        /* Efecto al hacer clic */
        .login-button:active {
            transform: scale(0.95);
            background-color: #0d164f;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>Bienvenido</h1>
        <p>Haz clic para iniciar sesión</p>

        <button class="login-button" onclick="alert('¡Inicio de sesión exitoso!')">
            Iniciar sesión
        </button>
    </div>

</body>
</html>
